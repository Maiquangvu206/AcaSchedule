# Local development overrides: hot-reload, exposed data ports, dev nginx config.
services:
  backend:
    build:
      target: development
    command: ["npm", "run", "dev"]
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://acaschedule:acaschedule@db:5432/acaschedule
    volumes:
      - ./backend/src:/app/src
      - ./backend/package.json:/app/package.json:ro
    ports:
      - "8000:8000"

  frontend:
    build:
      target: development
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "5173"]
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html:ro
      - ./frontend/vite.config.ts:/app/vite.config.ts:ro
      - ./frontend/tailwind.config.js:/app/tailwind.config.js:ro
      - ./frontend/postcss.config.js:/app/postcss.config.js:ro
    ports:
      - "5173:5173"

  webserver:
    volumes:
      - ./docker/nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro

  db:
    ports:
      - "5432:5432"

  redis:
    ports:
      - "6379:6379"
