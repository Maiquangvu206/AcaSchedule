name: CI/CD

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  REGISTRY_USER: ${{ github.actor }}
  REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

jobs:
  backend:
    name: Backend (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  ai:
    name: AI service (import + health smoke)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ai/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m compileall app
      - run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          from app.main import app

          client = TestClient(app)
          response = client.get('/health')
          assert response.status_code == 200, response.text
          assert response.json()['status'] == 'ok'
          print(response.json())
          PY

  docker:
    name: Docker images (build + push)
    runs-on: ubuntu-latest
    needs: [backend, frontend, ai]
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      backend_image: ${{ steps.images.outputs.backend }}
      frontend_image: ${{ steps.images.outputs.frontend }}
      ai_image: ${{ steps.images.outputs.ai }}
    steps:
      - uses: actions/checkout@v4
      - name: Get tag
        id: tag
        run: |
          if [[ ${{ github.ref_type }} == 'tag' ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT
          fi
      - name: Normalize GHCR image names
        id: images
        run: |
          namespace="$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          echo "backend=ghcr.io/${namespace}/backend" >> "$GITHUB_OUTPUT"
          echo "frontend=ghcr.io/${namespace}/frontend" >> "$GITHUB_OUTPUT"
          echo "ai=ghcr.io/${namespace}/ai" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.REGISTRY_USER }}
          password: ${{ env.REGISTRY_PASSWORD }}
      - uses: docker/setup-buildx-action@v3
      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.backend
          target: production
          push: true
          tags: ${{ steps.images.outputs.backend }}:${{ steps.tag.outputs.tag }}
      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.frontend
          target: production
          push: true
          tags: ${{ steps.images.outputs.frontend }}:${{ steps.tag.outputs.tag }}
      - name: Build and push AI
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.ai
          push: true
          tags: ${{ steps.images.outputs.ai }}:${{ steps.tag.outputs.tag }}

  deploy-staging:
    name: Deploy to staging
    runs-on: ubuntu-latest
    needs: [docker]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to staging
        run: |
          echo "Deploying backend:${{ needs.docker.outputs.tag }} to staging"
          echo "IMAGE=${{ needs.docker.outputs.backend_image }}:${{ needs.docker.outputs.tag }}" >> $GITHUB_ENV

  deploy-production:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs: [docker]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to production
        run: |
          echo "Deploying backend:${{ needs.docker.outputs.tag }} to production"
          echo "IMAGE=${{ needs.docker.outputs.backend_image }}:${{ needs.docker.outputs.tag }}" >> $GITHUB_ENV
