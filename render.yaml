services:
  # 1. Frontend (Vite Static Site)
  - type: web
    name: acaschedule-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://acaschedule-backend.onrender.com

  # 2. Backend (Express / Node.js)
  - type: web
    name: acaschedule-backend
    env: node
    plan: free
    rootDir: backend
    # The app is TypeScript: it must be compiled to dist/ before `npm start`.
    buildCommand: npm install --include=dev && npm run build
    # Migrations/seeds use the compiled JS so no dev-only tooling (tsx) is required at runtime.
    # Migrations are mandatory; the seed only ensures reference data + the admin
    # account, so a seed failure must never take the whole API offline.
    startCommand: npm run migrate:compiled && (npm run seed:compiled || echo "seed failed - starting API anyway") && npm start
    # Liveness probe (Redis/MinIO are optional on Render, so do not require them).
    healthCheckPath: /api/health/live
    envVars:
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        value: https://acaschedule-frontend-ax5x.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: acaschedule-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: SEED_ADMIN_EMAIL
        value: admin@acaschedule.local
      # Set this in the Render dashboard. A generated value would be unknown to
      # the operator, making the seeded admin account impossible to log into.
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: AI_SERVICE_URL
        value: https://acaschedule-ai-quju.onrender.com
      # Mail (Render free blocks SMTP ports — Resend HTTPS API is preferred)
      - key: RESEND_API_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: 587
      - key: SMTP_SECURE
        value: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false

      # ── Object storage (Cloudflare R2 / Backblaze B2 — S3 compatible) ──────
      # File tài liệu KHÔNG lưu trong Postgres. Toàn bộ file nằm ở bucket S3.
      # Xem docs/r2-setup.md để biết cách lấy từng giá trị.
      - key: MINIO_ENDPOINT
        sync: false # <account-id>.r2.cloudflarestorage.com
      - key: MINIO_PORT
        value: 443
      - key: MINIO_USE_SSL
        value: true
      - key: MINIO_PUBLIC_ENDPOINT
        sync: false # thường trùng MINIO_ENDPOINT
      - key: MINIO_PUBLIC_PORT
        value: 443
      - key: MINIO_PUBLIC_USE_SSL
        value: true
      - key: MINIO_ACCESS_KEY
        sync: false
      - key: MINIO_SECRET_KEY
        sync: false
      - key: MINIO_BUCKET
        value: acaschedule-documents
      - key: MINIO_REGION
        value: auto

      # ── AI admin panel (key store + usage tracking) ──────────────────────
      # Mã hoá API key lưu trong Postgres. Tạo: openssl rand -hex 32
      - key: AI_KEYS_SECRET
        sync: false
      # Bí mật chia sẻ với AI service cho /api/internal/ai/config.
      - key: AI_INTERNAL_TOKEN
        sync: false

  # 3. AI Service (FastAPI / Python)
  - type: web
    name: acaschedule-ai
    env: python
    plan: free
    rootDir: ai
    buildCommand: pip install -r requirements.txt
    # FastAPI app lives in ai/app/main.py (package `app`, module `main`).
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GEMINI_API_KEY
        sync: false
      # Xoay vòng nhiều key (mỗi key một project AI Studio → quota riêng).
      # Cách nhau bằng dấu phẩy, ví dụ: key1,key2,key3
      - key: GEMINI_API_KEYS
        sync: false
      # OpenRouter là nhà cung cấp AI thứ hai: khi Gemini hết quota, AI service
      # tự chuyển sang OpenRouter. Mỗi key một tài khoản → quota riêng.
      # Ví dụ: key1,key2,key3,key4,key5
      - key: OPENROUTER_API_KEYS
        sync: false
      - key: OPENROUTER_MODEL
        value: google/gemini-2.0-flash-001
      # Thứ tự ưu tiên, xoay vòng mỗi request: gemini,openrouter
      - key: AI_PROVIDER_ORDER
        value: gemini,openrouter
      # Kéo key/model do admin cấu hình trên web (backend giữ key mã hoá).
      - key: AI_INTERNAL_TOKEN
        sync: false
      - key: BACKEND_CONFIG_URL
        value: https://acaschedule-backend.onrender.com/api/internal/ai/config

databases:
  - name: acaschedule-db
    plan: free
    databaseName: acaschedule
    user: acaschedule
