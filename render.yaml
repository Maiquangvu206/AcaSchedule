services:
  # 1. Frontend (Vite Static Site)
  - type: web
    name: acaschedule-frontend
    env: static
    rootDir: frontend
    # Không tự deploy khi push code: phải bấm Manual Deploy trong dashboard.
    autoDeploy: false
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://acaschedule-backend-dbos.onrender.com

  # 2. Backend (Express / Node.js)
  # Tên phải khớp với service đang chạy thật (frontend trỏ tới *-dbos).
  - type: web
    name: acaschedule-backend
    env: node
    plan: free
    rootDir: backend
    # Không tự deploy khi push code, không tự áp render.yaml (phải bấm Sync/Deploy).
    autoDeploy: false
    # The app is TypeScript: it must be compiled to dist/ before `npm start`.
    buildCommand: npm install --include=dev && npm run build
    # Migrations/seeds use the compiled JS so no dev-only tooling (tsx) is required at runtime.
    # Migration là BẮT BUỘC (thiếu cột thì mọi API đọc DB sẽ lỗi) nên thất bại thì
    # deploy dừng, log rõ lỗi. Seed chỉ tạo dữ liệu tham chiếu + tài khoản admin
    # nên lỗi seed KHÔNG được làm sập API.
    startCommand: npm run migrate:compiled && (npm run seed:compiled || echo "SEED FAILED - starting API anyway") && npm start
    # Liveness probe (Redis/MinIO are optional on Render, so do not require them).
    healthCheckPath: /api/health/live
    envVars:
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        value: https://acaschedule-frontend-ax5x.onrender.com
      # Supabase (hoặc Render Postgres). Dùng `sync: false` để giá trị bạn
      # dán trong Render Dashboard không bị Blueprint ghi đè khi Sync.
      - key: DATABASE_URL
        sync: false
        # postgresql://postgres.<project-ref>:<PASSWORD>@aws-0-ap-southeast-2.pooler.supabase.com:5432/postgres
        # Lưu ý: mật khẩu có ký tự đặc biệt phải URL-encode (@ → %40, # → %23, : → %3A …)
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      # Redis là tuỳ chọn (cache + quota AI). Bỏ trống = app chạy ở chế độ
      # degraded, không cache và không giới hạn lượt/ngày.
      - key: REDIS_URL
        sync: false
      - key: SEED_ADMIN_EMAIL
        value: itacaschedule@gmail.com
      # Set this in the Render dashboard. A generated value would be unknown to
      # the operator, making the seeded admin account impossible to log into.
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: AI_SERVICE_URL
        value: https://acaschedule-ai-quju.onrender.com
      # Host của kho lưu trữ: KHÔNG kèm /bucket, KHÔNG có https://
      # (đã có trong MINIO_ENDPOINT ở trên — giữ cho MINIO_PUBLIC_ENDPOINT
      #  trỏ đúng host mà trình duyệt dùng để PUT file).
      # Mail — Render free chặn cổng SMTP (25/465/587) nên ưu tiên HTTP API.
      # Chọn MỘT trong hai dịch vụ (Resend hoặc Brevo), kèm SMTP_FROM:
      #   - Resend: cần domain đã verify; chưa verify chỉ dùng
      #     onboarding@resend.dev (gửi được tới email của tài khoản Resend).
      #   - Brevo: chỉ cần verify 1 địa chỉ người gửi (Gmail được) — dùng
      #     được khi chưa có domain. Free 300 email/ngày.
      - key: RESEND_API_KEY
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: 587
      - key: SMTP_SECURE
        value: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false

      # ── Object storage (Cloudflare R2 / Backblaze B2 — S3 compatible) ──────
      # File tài liệu KHÔNG lưu trong Postgres. Toàn bộ file nằm ở bucket S3.
      # Xem docs/r2-setup.md để biết cách lấy từng giá trị.
      - key: MINIO_ENDPOINT
        sync: false # <account-id>.r2.cloudflarestorage.com
      - key: MINIO_PORT
        value: 443
      - key: MINIO_USE_SSL
        value: true
      - key: MINIO_PUBLIC_ENDPOINT
        sync: false # thường trùng MINIO_ENDPOINT
      - key: MINIO_PUBLIC_PORT
        value: 443
      - key: MINIO_PUBLIC_USE_SSL
        value: true
      - key: MINIO_ACCESS_KEY
        sync: false
      - key: MINIO_SECRET_KEY
        sync: false
      - key: MINIO_BUCKET
        value: acaschedule
      - key: MINIO_REGION
        value: auto

      # ── AI admin panel (key store + usage tracking) ──────────────────────
      # Mã hoá API key lưu trong Postgres. Tạo: openssl rand -hex 32
      - key: AI_KEYS_SECRET
        sync: false
      # Bí mật chia sẻ với AI service cho /api/internal/ai/config.
      - key: AI_INTERNAL_TOKEN
        sync: false

  # 3. AI Service (FastAPI / Python)
  - type: web
    name: acaschedule-ai
    env: python
    plan: free
    rootDir: ai
    # Không tự deploy khi push code: phải bấm Manual Deploy trong dashboard.
    autoDeploy: false
    buildCommand: pip install -r requirements.txt
    # FastAPI app lives in ai/app/main.py (package `app`, module `main`).
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GEMINI_API_KEY
        sync: false
      # Model Gemini trực tiếp. Để trống thì AI service dùng mặc định
      # gemini-3.5-flash (xem ai/app/config.py).
      - key: GEMINI_MODEL
        sync: false
      # Xoay vòng nhiều key (mỗi key một project AI Studio → quota riêng).
      # Cách nhau bằng dấu phẩy, ví dụ: key1,key2,key3
      - key: GEMINI_API_KEYS
        sync: false
      # OpenRouter là nhà cung cấp AI thứ hai: khi Gemini hết quota, AI service
      # tự chuyển sang OpenRouter. Mỗi key một tài khoản → quota riêng.
      # Ví dụ: key1,key2,key3,key4,key5
      - key: OPENROUTER_API_KEYS
        sync: false
      - key: OPENROUTER_MODEL
        value: google/gemini-3.5-flash
      # Thứ tự ưu tiên, xoay vòng mỗi request: gemini,openrouter
      - key: AI_PROVIDER_ORDER
        value: gemini,openrouter
      # Kéo key/model do admin cấu hình trên web (backend giữ key mã hoá).
      - key: AI_INTERNAL_TOKEN
        sync: false
      - key: BACKEND_CONFIG_URL
        value: https://acaschedule-backend.onrender.com/api/internal/ai/config

databases:
  # Giữ lại để Blueprint không báo "thiếu tài nguyên"; backend thực tế dùng
  # DATABASE_URL đặt tay trong dashboard (Supabase hoặc DB này).
  - name: acaschedule-db
    plan: free
    databaseName: acaschedule
    user: acaschedule
