services:
  # ── Frontend (Static Site) ─────────────────────────────────────
  frontend:
    type: web
    env: static
    plan: free
    buildCommand: npm install && npm run build
    publishDir: dist
    rootDir: frontend
    envVars:
      VITE_API_URL: https://acaschedule-backend.onrender.com/api
    domainImportFrom: []

  # ── Backend (Web Service) ──────────────────────────────────────
  backend:
    type: web
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: node dist/main.js
    rootDir: backend
    envVars:
      NODE_ENV: production
      PORT: 8000
      CORS_ORIGIN: https://acaschedule-frontend.onrender.com
      DATABASE_URL: postgresql://acaschedule:acaschedule@acaschedule-db.ondigitalocean.io:25000/acaschedule
      REDIS_URL: redis://redis-12345.xxxxxx.use1.cache.amazonaws.com:6379
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      AI_SERVICE_URL: https://acaschedule-ai.onrender.com
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      POSTGRES_USER: acaschedule
      POSTGRES_PASSWORD: acaschedule
      POSTGRES_DB: acaschedule
      MINIO_PUBLIC_ENDPOINT: localhost
      MINIO_PUBLIC_PORT: 9000
    dependsOn:
      - database

  # ── AI Service (Python) ────────────────────────────────────────
  ai:
    type: web
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    rootDir: ai
    envVars:
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      AI_SERVICE_URL: https://acaschedule-ai.onrender.com

  # ── Database (PostgreSQL) ──────────────────────────────────────
  database:
    type: postgresql
    plan: free
    branches:
      only:
        - main
    autoBranchDeploymentInactiveTimeout: 15m
    envVars:
      POSTGRES_DB: acaschedule
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: acaschedule

forks:
  - name: acaschedule-fork
    services:
      - frontend
      - backend
      - ai
      - database